  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html, body {
      spellcheck: false;
      background-color: #F8FAFC;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0B1220; }
    }
    flt-semantics, flt-span, span { spellcheck: false !important; }
    #pluto-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }
    #pluto-boot span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #40A6FF;
      opacity: 0.35;
      animation: pluto-dot 900ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    #pluto-boot span:nth-child(2) { animation-delay: -600ms; }
    #pluto-boot span:nth-child(3) { animation-delay: -300ms; }
    @media (prefers-color-scheme: dark) {
      #pluto-boot span { background: #60A5FA; }
    }
    @keyframes pluto-dot {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
  </style>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js" crossorigin="anonymous"></script>
</head>
<body spellcheck="false">
  <div id="pluto-boot" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <script>
    (function () {
      var key = 'pluto-sw-20260918-appcheck';
      if (!('serviceWorker' in navigator) || localStorage.getItem(key)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
      }).then(function () {
        if (!window.caches) return;
        return caches.keys().then(function (names) {
          return Promise.all(names.map(function (name) { return caches.delete(name); }));
        });
      }).then(function () {
        localStorage.setItem(key, '1');
        location.reload();
      });
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('pluto-boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
